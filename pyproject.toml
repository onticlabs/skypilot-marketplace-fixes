[project]
name = "skypilot-marketplace-fixes"
version = "0.1.0.dev0"
description = "SkyPilot API-server patches for marketplace clouds: catalog freshness and multi-offer failover"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["skypilot==0.13.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/onticlabs/skypilot-marketplace-fixes"
Source = "https://github.com/onticlabs/skypilot-marketplace-fixes"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
